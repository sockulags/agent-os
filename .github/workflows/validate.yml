name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test npm CLI
        run: npm test

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Validate repository
        run: node scripts/validate-agent-os.mjs

      - name: Test validator red cases
        run: node scripts/test-validate-agent-os.mjs

      - name: Test behavior eval scorecard
        run: npm run test:evals

      - name: Test batch manifest hashing
        run: node skills/batch-work/scripts/test-manifest-hash.mjs
