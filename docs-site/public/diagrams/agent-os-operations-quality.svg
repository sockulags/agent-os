<!-- Learning pair --><rect x="320" y="548" width="232" height="56" rx="8" fill="#fff" stroke="#3c3c43"/><text x="336" y="572" fill="#3c3c43" font-size="12" font-weight="600" font-family="Inter,sans-serif">notice-lesson</text><text x="336" y="592" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">offers a durable lesson</text><rect x="704" y="548" width="232" height="56" rx="8" fill="#fff" stroke="#12b5a0"/><text x="720" y="572" fill="#3c3c43" font-size="12" font-weight="600" font-family="Inter,sans-serif">record-lesson</text><text x="720" y="592" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">write repo or global policy</text>
