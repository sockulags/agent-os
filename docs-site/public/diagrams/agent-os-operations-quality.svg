<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-quality-title ops-quality-desc"><title id="ops-quality-title">Agent OS operations and quality workflows</title><desc id="ops-quality-desc">Layered diagram explaining setup, dispatch, simplification, learning workflows and six automatic disciplines that guard implementation and review.</desc><defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#67676c"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6c4df6"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#12b5a0"/></marker></defs><rect width="1280" height="720" fill="#fff"/>
<!-- Bands --><rect x="40" y="52" width="1200" height="112" rx="8" fill="#f6f6f7" stroke="rgba(60,60,67,.14)"/><rect x="40" y="180" width="1200" height="184" rx="8" fill="rgba(108,77,246,.025)" stroke="rgba(108,77,246,.18)"/><rect x="40" y="380" width="1200" height="112" rx="8" fill="#f6f6f7" stroke="rgba(60,60,67,.14)"/><rect x="40" y="508" width="1200" height="112" rx="8" fill="#fff" stroke="rgba(60,60,67,.14)"/>
<text x="64" y="80" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">MANUAL · OPERATE</text><text x="64" y="208" fill="#6c4df6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">AUTOMATIC · GUARD IMPLEMENTATION AND REVIEW</text><text x="64" y="408" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">MANUAL · SIMPLIFY</text><text x="64" y="536" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">INTERRUPTION → LEARNING</text>
