<!-- Manual operations --><rect x="200" y="88" width="200" height="56" rx="8" fill="#fff" stroke="#3c3c43"/><text x="216" y="112" fill="#3c3c43" font-size="12" font-weight="600" font-family="Inter,sans-serif">init-agent-os</text><text x="216" y="132" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">machine policy or repo onboarding</text><rect x="456" y="88" width="368" height="56" rx="8" fill="rgba(108,77,246,.08)" stroke="#6c4df6"/><text x="472" y="112" fill="#3c3c43" font-size="12" font-weight="600" font-family="Inter,sans-serif">Living policy + live project state</text><text x="472" y="132" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">boundaries, planning surfaces, evidence, queue</text><rect x="880" y="88" width="200" height="56" rx="8" fill="#fff" stroke="#3c3c43"/><text x="896" y="112" fill="#3c3c43" font-size="12" font-weight="600" font-family="Inter,sans-serif">dispatch-next</text><text x="896" y="132" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">one decision-ready next action</text>
<!-- Automatic disciplines, six cards --><rect x="80" y="232" width="176" height="96" rx="8" fill="#fff" stroke="rgba(60,60,67,.30)"/><text x="96" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">diagnose-before-fix</text><text x="96" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">unknown failure</text><text x="96" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ supported cause first</text>
<rect x="268" y="232" width="176" height="96" rx="8" fill="#fff" stroke="rgba(60,60,67,.30)"/><text x="284" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">scope-guard</text><text x="284" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">adjacent discovery</text><text x="284" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ contain task drift</text>
<rect x="456" y="232" width="176" height="96" rx="8" fill="#fff" stroke="rgba(60,60,67,.30)"/><text x="472" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">proportional-testing</text><text x="472" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">changed behavior</text><text x="472" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ smallest useful checks</text>
<rect x="644" y="232" width="176" height="96" rx="8" fill="#fff" stroke="rgba(60,60,67,.30)"/><text x="660" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">simplifier-review</text><text x="660" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">candidate diff</text><text x="660" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ simpler solution check</text>
<rect x="832" y="232" width="176" height="96" rx="8" fill="rgba(108,77,246,.08)" stroke="#6c4df6"/><text x="848" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">verify-before-done</text><text x="848" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">completion claim</text><text x="848" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ fresh evidence</text>
<rect x="1020" y="232" width="176" height="96" rx="8" fill="#fff" stroke="rgba(60,60,67,.30)"/><text x="1036" y="260" fill="#3c3c43" font-size="11" font-weight="600" font-family="Inter,sans-serif">notice-lesson</text><text x="1036" y="284" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">developer correction</text><text x="1036" y="300" fill="#67676c" font-size="8" font-family="'Geist Mono',monospace">→ examine mismatch</text>
