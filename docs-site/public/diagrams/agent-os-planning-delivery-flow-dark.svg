<rect x="252" y="96" width="160" height="80" rx="8" fill="rgba(139,117,255,.08)" stroke="#8b75ff"/><text x="332" y="124" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">guide-me</text><text x="332" y="144" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">understand → explain</text><text x="332" y="160" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">approved TLDR</text>
<polygon points="552,168 632,208 552,248 472,208" fill="#1b1b1f" stroke="#dfdfd6"/><text x="552" y="204" fill="#dfdfd6" font-size="11" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">Several decision</text><text x="552" y="220" fill="#dfdfd6" font-size="11" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">threads?</text>
<rect x="652" y="96" width="160" height="80" rx="8" fill="#1b1b1f" stroke="#dfdfd6"/><text x="732" y="124" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">chart-work</text><text x="732" y="144" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">map + decision tickets</text><text x="732" y="160" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">parallel branches</text>
<rect x="884" y="96" width="160" height="80" rx="8" fill="#1b1b1f" stroke="#dfdfd6"/><text x="964" y="124" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">Bounded branch</text><text x="964" y="144" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">settled handoff or</text><text x="964" y="160" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">direct bounded idea</text>
<rect x="652" y="288" width="160" height="80" rx="8" fill="rgba(139,117,255,.08)" stroke="#8b75ff"/><text x="732" y="316" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">shape-work</text><text x="732" y="336" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">outcome + boundaries</text><text x="732" y="352" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ground truth + issues</text>
<rect x="884" y="288" width="160" height="80" rx="8" fill="#1b1b1f" stroke="#dfdfd6"/><text x="964" y="316" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">Ready issues</text><text x="964" y="336" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">stable dependencies</text><text x="964" y="352" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">explicit verification</text>
<rect x="472" y="448" width="160" height="80" rx="8" fill="#1b1b1f" stroke="#dfdfd6"/><text x="552" y="476" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">deliver-work</text><text x="552" y="496" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">one ready change</text><text x="552" y="512" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">bounded implementation</text>
<rect x="1008" y="448" width="160" height="80" rx="8" fill="#1b1b1f" stroke="#dfdfd6"/><text x="1088" y="476" fill="#dfdfd6" font-size="12" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">batch-work</text><text x="1088" y="496" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">isolated ready units</text><text x="1088" y="512" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">aggregate verification</text>
<rect x="836" y="488" width="80" height="64" rx="20" fill="rgba(68,203,184,.08)" stroke="#44cbb8"/><text x="876" y="516" fill="#dfdfd6" font-size="11" font-weight="600" font-family="Inter,sans-serif" text-anchor="middle">Verified</text><text x="876" y="532" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">target</text>
<!-- Side note --><rect x="80" y="620" width="1120" height="56" rx="8" fill="#202127" stroke="rgba(223,223,214,.14)"/><text x="104" y="644" fill="#dfdfd6" font-size="11" font-weight="600" font-family="Inter,sans-serif">dispatch-next can select one live target at the planning or delivery frontier.</text><text x="104" y="664" fill="#98989f" font-size="9" font-family="'Geist Mono',monospace">It does not invent work, infer a batch, merge, or deploy.</text>
</svg>
