<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-flow-title planning-flow-desc"><title id="planning-flow-title">Agent OS planning and delivery flow</title><desc id="planning-flow-desc">Flowchart routing vague or bounded work through guide-me, chart-work, shape-work, deliver-work, or batch-work to a verified delivery target.</desc><defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#98989f"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8b75ff"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#44cbb8"/></marker></defs><rect width="1280" height="720" fill="#1b1b1f"/>
<!-- Zones --><rect x="40" y="52" width="1200" height="172" rx="8" fill="rgba(139,117,255,.025)" stroke="rgba(139,117,255,.18)"/><rect x="40" y="244" width="1200" height="180" rx="8" fill="rgba(223,223,214,.02)" stroke="rgba(223,223,214,.12)"/><rect x="40" y="444" width="1200" height="144" rx="8" fill="rgba(68,203,184,.025)" stroke="rgba(68,203,184,.18)"/><text x="56" y="76" fill="#8b75ff" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">UNDERSTAND + PLAN</text><text x="56" y="268" fill="#98989f" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">MATERIALIZE READY WORK</text><text x="56" y="468" fill="#44cbb8" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">DELIVER + VERIFY</text>
